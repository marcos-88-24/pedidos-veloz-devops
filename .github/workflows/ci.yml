name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24  
      
      - name: Instalar dependências Pedidos
        run: |
          cd src/pedidos
          npm install --no-audit --no-fund

      - name: Instalar dependências Pagamentos
        run: |
          cd src/pagamentos
          npm install --no-audit --no-fund

      - name: Instalar dependências Estoque
        run: |
          cd src/estoque
          npm install --no-audit --no-fund

      
      - name: Lint Pedidos
        run: |
          cd src/pedidos
          npm run lint --if-present || echo "Sem lint definido, ignorando..."

      - name: Lint Pagamentos
        run: |
          cd src/pagamentos
          npm run lint --if-present || echo "Sem lint definido, ignorando..."

      - name: Lint Estoque
        run: |
          cd src/estoque
          npm run lint --if-present || echo "Sem lint definido, ignorando..."

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login no Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push - Pedidos
        uses: docker/build-push-action@v4
        with:
          context: ./src/pedidos
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/pedidos:latest

      - name: Build e Push - Pagamentos
        uses: docker/build-push-action@v4
        with:
          context: ./src/pagamentos
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/pagamentos:latest

      - name: Build e Push - Estoque
        uses: docker/build-push-action@v4
        with:
          context: ./src/estoque
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/estoque:latest
